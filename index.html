<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js do Zero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Canvas onde o Three.js vai renderizar o 3D -->
  <canvas id="canvas"></canvas>

  <!-- UI sobreposta ao canvas -->
  <div class="ui">
    <p class="label">Three.js do Zero</p>
    <h1>Seu primeiro <em>3D</em><br/>no browser</h1>
    <p class="hint">🖱 Arraste para girar · Scroll para zoom</p>
  </div>

  <!-- Instruções de instalação -->
  <!-- npm create vite@latest threejs-demo -- --template vanilla -->
  <!-- npm install three -->

  <script type="module" src="main.js"></script>
</body>
</html>
